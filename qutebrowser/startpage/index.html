<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>~/homepage</title>
    <link id="theme-colors" rel="stylesheet" type="text/css" href="colors.css">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container">
        <div class="left-container">
            <div class="gif">
                <img id="cat" src="cat-transparent.gif" />
            </div>
        </div>

        <div class="right-container">
            <div class="head">
                <p>&gt; econhead ~/<span class="blinking">_</span></p>
            </div>

            <div class="bookmarks">
                <div class="category">
                    <ul class="links">
                        <li class="title">personal/</li>
                        <li><a href="https://github.com/econhead/">github</a></li>
                        <li><a href="https://calendar.google.com/calendar/u/1/r/">calendar</a></li>
                        <li><a href="https://mail.google.com/mail/u/1/#inbox">gmail</a></li>
                        <li><a href="https://drive.google.com/drive/home">gdrive</a><li>
                    </ul>
                </div>

                <div class="category">
                    <ul class="links">
                        <li class="title">docs/</li>
                        <li><a href="https://asahilinux.org/docs/">asahi</a></li>
                        <li><a href="https://neovim.io/doc/">neovim</a></li>
                        <li><a href="https://qutebrowser.org/doc/help/">qutebrowser</a></li>
                        <li><a href="https://docs.noctalia.dev">noctalia</a></li>
                    </ul>
                </div>

                <div class="category">
                    <ul class="links">
                        <li class="title">social/</li>
                        <li><a href="https://reddit.com/">reddit</a></li>
                        <li><a href="https://instagram.com/">instagram</a></li>
                        <li><a href="https://x.com/">twitter</a></li>
                        <li><a href="https://forum.econschool.in/">econschool</a></li> 
                    </ul>
                </div>

                <div class="category">
                    <ul class="links">
                        <li class="title">utilities/</li>
                        <li><a href="https://web.whatsapp.com/">whatsapp</a></li>
                        <li><a href="https://chatgpt.com/">chatgpt</a></li>
                        <li><a href="https://www.desmos.com/calculator">desmos</a></li>
                        <li><a href="https://www.geogebra.org/calculator">geogebra</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
    const themeColors = document.getElementById('theme-colors');

    function updateCat() {
        const bg = getComputedStyle(document.documentElement)
            .getPropertyValue('--color-bg')
            .trim();
        const rgb = bg.match(/\w\w/g).map(x => parseInt(x, 16));
        const brightness =
            (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;

        document.getElementById('cat').classList.toggle('dark-cat', brightness < 128);
    }

    function refreshTheme() {
        themeColors.href = `colors.css?refresh=${Date.now()}`;
    }

    themeColors.addEventListener('load', updateCat);
    updateCat();
    setInterval(() => {
        if (document.visibilityState === 'visible') refreshTheme();
    }, 10000);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refreshTheme();
    });
    </script>

</body>

</html>
